name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The version .sandbox/Dockerfile builds. Bump both together.
      SPOT_VERSION: 2.15.1
    steps:
      # Without submodules: latex/ is the Overleaf mirror, which CI has no
      # credential for and the build does not read.
      - uses: actions/checkout@v4

      - name: Install the toolchain and MONA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make cmake pkg-config mona

      - name: Restore Spot
        id: spot
        uses: actions/cache@v4
        with:
          path: ~/spot
          key: spot-${{ env.SPOT_VERSION }}-${{ runner.os }}-ubuntu-24.04

      - name: Build Spot
        if: steps.spot.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://www.lrde.epita.fr/dload/spot/spot-${SPOT_VERSION}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/spot-${SPOT_VERSION}"
          ./configure --prefix="$HOME/spot" --disable-python --disable-devel --disable-static
          make -j"$(nproc)"
          make install-strip

      - name: Configure
        run: cmake -S . -B build -DSPOT_ROOT="$HOME/spot"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
